spring.application.name=controle-eiv

# Banco em memória para rodar sem instalar nada. Para PostgreSQL, use o perfil "postgres".
spring.datasource.url=jdbc:h2:mem:eiv;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# O esquema é criado pelo Flyway; o Hibernate só confere se as entidades batem com ele.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html

eiv.prazo-padrao-dias=30
eiv.alerta-dias=7
eiv.dados-exemplo=true
